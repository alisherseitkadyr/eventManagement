services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/qonaq?sslmode=disable
      AUTH_JWT_SECRET: change-me-in-production-use-32-bytes
      LOG_LEVEL: debug
      LOG_PRETTY: "true"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - railway_network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qonaq
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - railway_network

volumes:
  postgres_data:

networks:
  railway_network:
    driver: bridge
