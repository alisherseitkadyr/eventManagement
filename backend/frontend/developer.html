<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Templates Test UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }

    button {
      padding: 10px 15px;
      background: #2563eb;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .meta {
      font-size: 12px;
      color: #94a3b8;
    }

    .blocks {
      margin-top: 10px;
      font-size: 13px;
    }

    .block {
      padding: 5px;
      background: #0b1220;
      margin-top: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h1>Templates Debug UI</h1>

<button onclick="loadTemplates()">Load Templates</button>

<div id="output" class="grid"></div>

<script>
async function loadTemplates() {
  const output = document.getElementById("output");
  output.innerHTML = "Loading...";

  try {
    const res = await fetch("http://localhost:8080/templates");
    const data = await res.json();

    output.innerHTML = "";

    data.forEach(t => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="title">${t.name}</div>
        <div class="meta">ID: ${t.id}</div>
        <div class="meta">Type: ${t.type}</div>
        <div class="meta">Active: ${t.isActive}</div>

        <div class="blocks">
          <b>Blocks:</b>
          ${(t.blocks || []).map(b => `
            <div class="block">
              ${b.label} (${b.blockId})
            </div>
          `).join("")}
        </div>
      `;

      output.appendChild(card);
    });

  } catch (err) {
    output.innerHTML = "Error: " + err.message;
  }
}
</script>

</body>
</html>
